# Summary: Scheduled build for an organization's data repository on a GitLab
# instance with its own runners, such as an institution's self-hosted
# GitLab. Checks out Extractium at a pinned version, installs its pinned
# dependencies, keeps the crawl cache and the embedding model between
# runs, and keeps the output folder as a pipeline artifact. An optional
# job publishes the folder to GitLab Pages where the instance has Pages
# turned on.
# Notes: See README file for documentation and full license information.
#
