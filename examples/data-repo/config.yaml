# Display name of the published knowledge base.
name: "Example Org Knowledge Base"

# Where the built files land. The workflow publishes this folder.
out_dir: dist

# The pages to read. One web source is enough to start: the crawl stays
# inside the site the seed URL belongs to. The label is the name a reader
# sees for this collection, and every source needs one. See the
# configuration reference for include and exclude patterns.
sources:
  - type: web
    label: Example Knowledge Base
    seed_url: "https://example.edu/TDClient/000/ExampleOrg/Home/"

  # A channel's captions. Remove the comment markers to turn it on, and
  # read kb-cache/README.md first: YouTube refuses caption requests from
  # cloud runners, so you build this source once on your own machine and
  # commit kb-cache/ for the scheduled build to reuse.
  #
  # Name the channel however your browser showed it: a handle, the
  # address, or the id. No API key is needed. Without one, a listing
  # longer than a hundred videos stops there, because reading further
  # means an address YouTube's robots.txt disallows; set YOUTUBE_API_KEY
  # to read the whole channel.
  # - type: youtube
  #   label: Example Video Library
  #   channel_id: "https://www.youtube.com/@ExampleChannel"
  #   languages: ["en"]

# The files to write. These two are the defaults; they are listed here so
# it is obvious what gets published.
outputs:
  - type: container
    file: kb-index.json
  - type: llmstxt

# A safety net while you are still tuning the patterns. Raise it once the
# page list in dist/llms.txt looks right.
max_pages: 500

# Seconds between requests, so the crawl stays polite to the site it reads.
delay_seconds: 0.5

# Where fetched content is kept between builds. Named here rather than
# left at the default, because a YouTube build commits part of it: see
# kb-cache/README.md. The rest of the folder is a convenience you can
# delete whenever you like.
cache_dir: kb-cache
