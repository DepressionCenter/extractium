# Display name of the published knowledge base.
name: "Example Org Knowledge Base"

# Where the built files land. The workflow publishes this folder.
out_dir: dist

# The pages to read. One web source is enough to start: the crawl stays
# inside the site the seed URL belongs to. See the configuration reference
# for include and exclude patterns.
sources:
  - type: web
    seed_url: "https://example.edu/TDClient/000/ExampleOrg/Home/"

# The files to write. These two are the defaults; they are listed here so
# it is obvious what gets published.
outputs:
  - type: container
    file: kb-index.json
  - type: llmstxt

# A safety net while you are still tuning the patterns. Raise it once the
# page list in dist/llms.txt looks right.
max_pages: 500

# Seconds between requests, so the crawl stays polite to the site it reads.
delay_seconds: 0.5
