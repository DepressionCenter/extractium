# Summary: Weekly scheduled build for an organization's data repository,
# also runnable from the Actions tab with the "Run workflow" button. Checks
# out Extractium at a pinned version, installs its pinned dependencies,
# reuses the crawl cache between runs, and publishes the output folder to
# GitHub Pages through the official Pages actions.
