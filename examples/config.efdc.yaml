# Summary: A build configuration for the Eisenberg Family Depression Center at
# the University of Michigan. It gathers the center's public documentation --
# the U-M Health Research Resource Library, the Open Source Hub, the GitHub
# repositories, the main website and its Depression Center Toolkit, and the
# Peer-to-Peer program site -- into one searchable index. Copy it to
# config.yaml and run it.
