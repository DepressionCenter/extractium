# the University of Michigan. It gathers the center's public documentation --
# the U-M Health Research Resource Library, the Open Source Hub, the GitHub
# repositories, the main website and its Depression Center Toolkit, the
# Peer-to-Peer program site, and the center's Deep Blue collections -- into
# one searchable index. Copy it to config.yaml and run it.
