name: Eisenberg Family Depression Center Resource Library


# ---------------------------------------------------------------------------
# BEFORE THE FIRST RUN: the depressioncenter.org sites answer 403
#
# As of 2026-09-09, depressioncenter.org, p2p.depressioncenter.org, and
# code.depressioncenter.org all answer 403 to this crawler, with the header
# "cf-mitigated: challenge". That is Cloudflare's interstitial, which asks a
# visitor's browser to run a script before it will serve the page. A crawler
# runs no scripts, so it cannot pass, and no change to this file can make it.
#
# The center owns those sites, so the fix belongs in Cloudflare: add a WAF
# skip rule for the build, matched on its User-Agent or on the address it runs
# from. Until then those three sources contribute nothing, and the build says
# so page by page rather than failing.
#
# teamdynamix.umich.edu serves the crawler normally, so source 1 works today.
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# Sources
#
# A page two sources both reach is indexed once, by whichever reached it
# first, and the build says how many pages that happened to. So an overlap
# costs duplicated fetching rather than a failed build. It is still worth
# avoiding: that is why the Depression Center Toolkit is not a source of its
# own below. It is a section of depressioncenter.org, so it belongs to the
# same crawl, as a second place for that crawl to start.
# ---------------------------------------------------------------------------

sources:

  # 1. U-M Health Research Resource Library, the center's TeamDynamix
  #    knowledge base, and the canonical documentation for most projects.
  #    The crawl keeps itself inside this portal's own folder rather than
  #    wandering into the rest of teamdynamix.umich.edu.
  #    Short link: https://michmed.org/efdc-kb
  - label: U-M Health Research Resource Library
    type: web
    seed_url: https://teamdynamix.umich.edu/TDClient/210/DepressionCenter/Home/

  # 2. Depression Center Open Source Hub. This site links out to many repositories under
  #    other people's GitHub accounts, in its curated list of research tools
  #    built elsewhere. Those accounts are NOT read: only accounts this file
  #    names are. The build counts them and names them once at the end, which
  #    is the guardrail working rather than an error. See github_owners below.
  - label: Depression Center Open Source Hub
    type: web
    seed_url: https://code.depressioncenter.org/

  # 3. The center's own GitHub repositories, read through the GitHub API
  #    rather than scraped page by page. Set GITHUB_TOKEN in the environment
  #    to raise the request limit; the same content is read without one.
  - label: Depression Center Open Source Hub
    type: github_api
    org: DepressionCenter
    include_forks: false        # a fork and its original are near-identical
    include_archived: true      # archived documentation is still documentation

  # 4. The main website, including the Depression Center Toolkit.
  #
  #    The Toolkit is a section of this site rather than a site of its own,
  #    so it is not a separate source. It is a second place for this one
  #    crawl to start, which covers it even if the main navigation does not
  #    link to every part of it.
  #
  #    One crawl, so one list of pages already visited: anything reachable
  #    from both addresses is fetched once and indexed once. One page
  #    budget, and one set of patterns, too.
  - label: Depression Center Website
    type: web
    seed_urls:
      - https://depressioncenter.org/
      - https://depressioncenter.org/outreach-education/depression-center-toolkit

  # 5. Peer-to-Peer Depression Awareness Program Resource Center. Its own
  #    host, so it cannot overlap with source 4.
  - label: Peer-to-Peer Depression Awareness Program Resource Center
    type: web
    seed_url: https://p2p.depressioncenter.org/

  # 6. EFDC YouTube channel: https://www.youtube.com/@DepressionCenter
  #
  #    NOT YET AVAILABLE. The youtube source arrives in phase 11 of the
  #    implementation plan. Uncommenting this today stops the build with
  #    "no source named 'youtube'". It will also need YOUTUBE_API_KEY in the
  #    environment, and the channel id rather than the @handle.
  #
  #- type: youtube
  #  channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
  #  languages: [en]

  # 7. The two U-M Library Deep Blue collections:
  #      EFDC:   https://hdl.handle.net/2027.42/195355
  #      MeTRIC: https://hdl.handle.net/2027.42/195645
  #
  #    NOT A WEB CRAWL, and not yet available.
  #
  #    Deep Blue builds its pages in the browser. A collection page is about
  #    650 KB of markup holding roughly 2,300 characters of navigation text,
  #    and the list of deposits is not in it. Crawling it would add the
  #    collection's name and nothing else.
  #
  #    Deep Blue publishes a machine interface instead, which already holds
  #    the text of every deposited file. Reading it is the dspace source,
  #    which arrives in phase 13 of the implementation plan. Uncommenting
  #    this today stops the build with "no source named 'dspace'".
  #
  #    Both collections belong to one source, because they are one thing:
  #    the Depression Center's deposits in Deep Blue.
  #
  #- type: dspace
  #  api_url: https://backend.production.deepblue-documents.lib.umich.edu/server/api
  #  site_url: https://deepblue.lib.umich.edu
  #  label: Deep Blue Documents
  #  collections:
  #    - 3acf951c-e107-4b8d-8f7d-ced171665b11    # Eisenberg Family Depression Center
  #    - 7503b0dc-27a2-4ce9-bcbc-50b339ecb486    # MeTRIC
  #
  #    See docs/dspace-repository-indexing.md. Note the interface is on a
  #    different host from the site a reader opens; that is not a mistake.

  # 8. Campus Mind Works: https://campusmindworks.org/
  #    On the center's own list of resources, but a site for students rather
  #    than project documentation. Add it if you want it in the index.
  #
  #- type: web
  #  seed_url: https://campusmindworks.org/


# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

outputs:
  # The search index every client reads.
  - type: container
    file: efdc-compendium.json
  # llms.txt and llms-full.txt, for language models that browse the web.
  - type: llmstxt
  # The same content as tables, for anyone who would rather write SQL.
  #- type: sqlite
  #  file: compendium.sqlite


# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

out_dir: dist
cache_dir: .kb_cache

# A ceiling for the whole build. Raise it once the page list in dist/llms.txt
# looks right. For a first run, cap it far lower from the command line instead
# of editing this file:
#   python -m extractium.cli build --config config.yaml --max-pages 25
max_pages: 5000

# Seconds between requests. These are the center's own sites, but they are
# shared university infrastructure, so the polite default stays.
delay_seconds: 0.5

# Every source here is public documentation, and none of it should hold
# participant data. "all" scans all of it anyway and writes a report for a
# person to read. For a health research center that is the right setting: the
# check is cheap, and it never states an absence of protected health
# information, only what it matched.
phi_lint: all

# GitHub accounts this build may follow links into, beyond the ones its own
# sources name. Source 3 names DepressionCenter, so that account is already
# allowed and needs no entry here.
#
# The Open Source Hub links to repositories under many other accounts, in its
# curated list of research tools built elsewhere. None of them is read. Run
# the build once and read the line it prints:
#
#   coverage : Not read; add to github_owners to include: <account> (N links)
#
# Then add only the accounts you actually want. Exact names; patterns are
# refused. Allowing an account lets links into it be followed. It does not
# index everything that account has ever published.
github_owners: [DepressionCenter]
