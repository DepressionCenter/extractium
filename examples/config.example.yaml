# ---------------------------------------------------------------------------
# Required: the sources list
#
# Each entry names a source type, a label, and its options. One web source
# with a seed URL is enough to start. Keys and API tokens never go in this
# file; sources that need one read it from the environment.
#
# Every source needs a label: the name a reader sees for the collection it
# came from, such as "Staff Handbook" or "Video Library". It names the source
# in llms.txt and travels with every section in the compendium, so a search
# result can say where its answer came from. Two web sources cannot be told
# apart without it, which is why it is required rather than guessed.
#
# A source may also carry a description: one or two sentences saying what
# it is. llms.txt prints it beside the source's name, and it is how a
# language model decides which source to open. Without one, the description
# of the source's starting page is used.
#
# A page two sources both reach is indexed once, by whichever reached it
# first, and the build says how many pages that happened to. An overlap
# costs duplicated fetching, not a failed build; a section of a site you
# already crawl belongs to that crawl as a second seed_urls entry, not to a
# source of its own. See examples/config.efdc.yaml for a complete, working
# configuration that uses every source type.
# ---------------------------------------------------------------------------

sources:
  # The web crawler. It starts at seed_url, stays within that site (or
  # the TeamDynamix portal the URL belongs to), and asks the installed
  # site handlers how to read each page it visits.
  #
  # For a site whose sections do not link to one another, write seed_urls
  # (a list) instead of seed_url, and the one crawl starts at each of
  # them. Give one form or the other, never both.
  #
  # Avoid a short link here. If the address redirects somewhere the crawl
  # is not allowed to follow, the build refuses that seed and names the
  # address to use instead.
  - type: web
    label: Example Knowledge Base
    #description: "How-to articles and policies for staff and students."
    seed_url: "https://example.edu/TDClient/000/ExampleOrg/Home/"

    # Pages the crawl is allowed to visit. A URL must match at least one
    # entry. The default is an empty list, which means "work it out from
    # the seed URL". Add entries only to reach more, such as a second site.
    #include_patterns:
    #  - '/TDClient/000/ExampleOrg/'         # this portal's knowledge base
    #  - 'example\.org/research-services/'   # one folder of a second site
    #  - 'github\.com/example-org/[A-Za-z0-9_.-]+(?:/|$)'  # one code host account

    # Single pages on other hosts that this site links to: a shared Google
    # file, a handout on a file host. A page matching one of these is
    # fetched and indexed when a page of the site links to it, and its own
    # links are never followed, so the crawl never spreads to that host.
    # Unlike include_patterns, the automatic scope stays as it is.
    #leaf_patterns:
    #  - '^https://docs\.google\.com/'       # Google Docs, Sheets, and Slides shared with the link
    #  - '^https://files\.example\.org/'     # handouts on a file host

    # Whether a link to a Word, OpenDocument, RTF, PDF, or slide file is fetched
    # and its text indexed, with the file's own headings, keywords, and
    # description. Off by default. Such files usually sit on another host,
    # so pair this with a leaf pattern for the host that serves them. The
    # old binary .doc format is not read, and a scanned PDF holds no text.
    #read_documents: true

    # Pages the crawl must not fetch at all, added to the built-in list.
    # Checked after include_patterns, so an entry here always wins. The
    # built-in list is the files that are not readable text plus what each
    # enabled site handler adds: search forms, logins, print views, program
    # folders such as cgi-bin, cdn-cgi, scripts, and api, tag
    # pages, faceted views, and code-host housekeeping pages.
    #extra_crawl_exclude_patterns:
    #  - '/our-members\?'

    # The same list, but replacing the built-in one instead of adding to
    # it. Write an empty list ([]) to switch every exclusion off.
    #crawl_exclude_patterns:
    #  - '/Search[/?$]'
    #  - '/Login[/?$]'

    # Pages the crawl may visit and follow links from, but whose own content
    # stays out of the index. Use this for menu and category pages. As
    # above, the extra_ form adds to the built-in list and the plain form
    # replaces it.
    #extra_index_exclude_patterns:
    #  - '/directory/'
    #index_exclude_patterns:
    #  - '/Category/'
    #  - '/tree/'

    # Which site handlers take part in this crawl. Leave it out to use every
    # installed handler (tdx and github ship enabled). Write an empty list
    # ([]) to read every page with the generic handler only. The generic
    # handler is always on, and a handler that is off also stops adding its
    # exclude patterns.
    #site_handlers: [tdx, github]

  # A folder of Markdown, text, and HTML files on this machine. Content from
  # a local source stays out of every output unless that output sets
  # include_local: true (see the outputs list). read_documents: true also
  # reads the folder's Word, OpenDocument, RTF, PDF, and slide files, and adds their
  # globs to the defaults below.
  #- type: local
  #  label: Internal Notes
  #  path: ./internal-docs
  #  include_globs: ["**/*.md", "**/*.txt", "**/*.html"]
  #  read_documents: false

  # A knowledge bundle another build wrote, in the Open Knowledge Format,
  # from this tool or any other. Each concept keeps the address it was
  # read from; one whose address is local: stays local, as above.
  #- type: okf
  #  label: Partner Knowledge Base
  #  path: ./partner-okf

  # A GitHub account's repositories, read through the API rather than
  # scraped page by page. Give exactly one of org, user, or url. Uses
  # GITHUB_TOKEN from the environment when it is set, which raises the
  # request limit; the same content is read without one.
  #
  # You often do not need this type at all: a web source whose seed_url is
  # a GitHub address reads the API by itself.
  #- type: github_api
  #  label: Example Repositories
  #  org: example-org
  #  #user: example-person          # instead of org, for a person's own repositories
  #  #url: https://github.com/example-org/example-tools   # or one repository
  #  include_repos: []              # empty means every repository that matches
  #  exclude_repos: []              # an exclusion always wins
  #  include_forks: false           # forks fill the index with near-identical copies
  #  include_archived: true         # archived documentation is still documentation
  #  include_code: true             # read the structure of the code, not only the docs
  #  ctags_fallback: true           # let Universal Ctags read languages no grammar covers
  #  read_documents: false          # read Word, OpenDocument, RTF, PDF, and slide files, one request each
  #  max_file_bytes: 2000000        # larger files are skipped, and each one is named
  #  max_repositories: 100          # read this many of the account's repositories, alphabetically;
  #                                 # the rest are named in the log, and include_repos chooses
  #  max_files_per_repository: 1000 # the root README is always read first, code last
  #
  # Code analysis needs the optional parser set: pip install "extractium[code]".
  # Without it every source file is still recorded by name, with its language,
  # its length, and a link. A record holds signatures, documentation, imports,
  # and calls -- never a source body. It also multiplies how many records a
  # repository produces, so set include_code: false where the code is not what
  # people are searching for.

  # Scholarly deposits held in a DSpace repository, such as a university
  # library's. Read through the repository's own interface, which already
  # holds the text of every deposited file, so no PDF reader is involved.
  #
  # The two addresses are different hosts and neither implies the other:
  # site_url is where a reader opens a deposit, and api_url is the interface
  # behind it, named in the reader site's own dspaceServer setting.
  #
  # Collections are listed, never discovered: a repository holds everybody's
  # deposits. Write each one as the handle link the repository publishes, or
  # as the identifier in the address a browser shows after following it.
  #- type: dspace
  #  label: Example Repository
  #  api_url: https://repository.example.edu/server/api
  #  site_url: https://repository.example.edu
  #  collections:
  #    - https://hdl.handle.net/9999.1/1001      # a handle link
  #    - 11111111-1111-4111-8111-111111111111    # or a collection identifier
  #  include_full_text: true         # false indexes each deposit's description alone
  #  max_file_bytes: 2000000         # larger files are skipped, and each one is named

  # Captions from a YouTube channel, playlists, or single videos. Each
  # stretch of a transcript is cited at the moment it was said. No key is
  # needed: without one, the newest hundred videos of each listing are
  # read, which is where YouTube's robots.txt stops the crawler; set
  # YOUTUBE_API_KEY in the environment to read a whole channel. Fetching
  # captions needs the optional install, pip install "extractium[youtube]",
  # which the build scripts already include.
  #
  # YouTube refuses caption requests from cloud-provider addresses, so a
  # scheduled build cannot fetch a transcript. Build once on your own
  # machine and commit the folder cache_dir names; later builds read the
  # stored transcripts. Set cache_dir to a visible folder for that, since
  # the default .kb_cache is usually ignored.
  #- type: youtube
  #  label: Example Video Library
  #  channel_id: "https://www.youtube.com/@ExampleChannel"   # handle, address, or id
  #  playlist_ids: []          # ids, or addresses with list= in them
  #  video_ids: []             # ids, watch addresses, or youtu.be links
  #  languages: [en]
  #  include_playlists: true   # read the channel's playlists as well as its uploads
  #  only_channel_videos: true # skip playlist videos another channel published
  #  delay_seconds: 1          # seconds between requests to YouTube; never less than 1


