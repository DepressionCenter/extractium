# ---------------------------------------------------------------------------
# Optional global settings -- the values shown are the defaults.
# Uncomment a line to change it.
# ---------------------------------------------------------------------------

# Display name of the knowledge base. Defaults to the title of the first
# page crawled.
#name: "Example Org Knowledge Base"

# Folder every output is written under. A relative path is resolved from
# the folder you run the build in.
#out_dir: dist

# Folder for fetched pages between builds, so a rerun only downloads what
# changed.
#cache_dir: .kb_cache

# The most pages one build may visit. This is a safety net: if an include
# pattern is broader than you meant, the crawl still stops here.
#max_pages: 10000

# Seconds to wait between requests, so the crawl stays polite to the site
# it is reading. Use 0 for no wait.
#delay_seconds: 0.5

# Extra GitHub accounts this build may follow links into. A GitHub account
# is read only when you named it: as a source, or here. Without this, one
# link in one README could pull thousands of other people's repositories
# into your index. Write exact account names, never patterns. Allowing an
# account lets links into it be followed; it does not list everything that
# account has published.
#github_owners:
#  - some-collaborator

# How the crawler introduces itself to each site. The default names the
# tool and its repository.
#user_agent: "Extractium/0.1.0 (+https://github.com/DepressionCenter/extractium)"

# Whether to honor each site's robots.txt. A site whose robots.txt cannot
# be read is skipped entirely. Switch it off only for sites you own: as
# well as ignoring robots rules, it lets a page that answers 403 to the
# crawler be requested once more as a browser, which is the only way past
# a filter that turns away anything that is not one.
#respect_robots_txt: true

# Which content the PHI (protected health information) check scans:
# local (local sources only), all, or off. Every build writes
# phi-lint-report.txt and phi-lint-report.json where you ran it, never
# into out_dir. Quote the value to switch the check off: YAML reads a
# bare off as false.
#phi_lint: local


# ---------------------------------------------------------------------------
# Writing patterns safely
#
#  - Wrap every pattern in single quotes. YAML then keeps the text exactly
#    as you typed it, so a backslash stays a single backslash.
#  - A dot matches any character until you escape it: 'example\.edu'.
#  - Keep patterns simple. A very complicated pattern can make matching slow
#    on long URLs.
#  - Try a change with a small max_pages first, then raise it.
# ---------------------------------------------------------------------------
