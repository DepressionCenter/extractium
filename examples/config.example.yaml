# ---------------------------------------------------------------------------
# Required: the sources list
#
# Each entry names a source type and its options. One web source with a
# seed URL is enough to start. Keys and API tokens never go in this file;
# sources that need one read it from the environment.
# ---------------------------------------------------------------------------

sources:
  # The web crawler. It starts at seed_url, stays within that site (or
  # the TeamDynamix portal the URL belongs to), and asks the installed
  # site handlers how to read each page it visits.
  - type: web
    seed_url: "https://example.edu/TDClient/000/ExampleOrg/Home/"

    # Pages the crawl is allowed to visit. A URL must match at least one
    # entry. The default is an empty list, which means "work it out from
    # the seed URL". Add entries only to reach more, such as a second site.
    #include_patterns:
    #  - '/TDClient/000/ExampleOrg/'         # this portal's knowledge base
    #  - 'example\.org/research-services/'   # one folder of a second site
    #  - 'github\.com/example-org/[A-Za-z0-9_.-]+(?:/|$)'  # one code host account

    # Pages the crawl must not fetch at all. Checked after include_patterns,
    # so an entry here always wins. The default skips search forms, logins,
    # print views, tag pages, code-host housekeeping pages, and files that
    # are not readable text. Write an empty list ([]) to switch it off.
    #crawl_exclude_patterns:
    #  - '/Search[/?$]'
    #  - '/Login[/?$]'

    # Pages the crawl may visit and follow links from, but whose own content
    # stays out of the index. Use this for menu and category pages.
    #index_exclude_patterns:
    #  - '/Category/'
    #  - '/tree/'

    # Which site handlers take part in this crawl. Leave it out to use every
    # installed handler (tdx and github ship enabled). Write an empty list
    # ([]) to read every page with the generic handler only.
    #site_handlers: [tdx, github]

  # A folder of Markdown, text, and HTML files on this machine. Content from
  # a local source stays out of every output unless that output sets
  # include_local: true (see the outputs list).
  #- type: local
  #  path: ./internal-docs
  #  include_globs: ["**/*.md", "**/*.txt", "**/*.html"]

  # Every repository of a GitHub organization, listed through the API.
  # Uses GITHUB_TOKEN from the environment when it is set.
  #- type: github_api
  #  org: example-org

  # Captions from a YouTube channel, playlists, or single videos. Listing a
  # channel or playlist needs YOUTUBE_API_KEY in the environment.
  #- type: youtube
  #  channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
  #  playlist_ids: []
  #  video_ids: []
  #  languages: [en]


# ---------------------------------------------------------------------------
# Optional: the outputs list
#
# Leave it out to write the two defaults shown here: the container file
# and the llms.txt pair. Every output is written under out_dir.
# ---------------------------------------------------------------------------

