# ---------------------------------------------------------------------------
# Required: the sources list
#
# Each entry names a source type, a label, and its options. One web source
# with a seed URL is enough to start. Keys and API tokens never go in this
# file; sources that need one read it from the environment.
#
# Every source needs a label: the name a reader sees for the collection it
# came from, such as "Staff Handbook" or "Video Library". It heads a section
# in llms.txt and travels with every section in the index, so a search
# result can say where its answer came from. Two web sources cannot be told
# apart without it, which is why it is required rather than guessed.
# ---------------------------------------------------------------------------

sources:
  # The web crawler. It starts at seed_url, stays within that site (or
  # the TeamDynamix portal the URL belongs to), and asks the installed
  # site handlers how to read each page it visits.
  #
  # For a site whose sections do not link to one another, write seed_urls
  # (a list) instead of seed_url, and the one crawl starts at each of
  # them. Give one form or the other, never both.
  #
  # Avoid a short link here. If the address redirects somewhere the crawl
  # is not allowed to follow, the build refuses that seed and names the
  # address to use instead.
  - type: web
    label: Example Knowledge Base
    seed_url: "https://example.edu/TDClient/000/ExampleOrg/Home/"

    # Pages the crawl is allowed to visit. A URL must match at least one
    # entry. The default is an empty list, which means "work it out from
    # the seed URL". Add entries only to reach more, such as a second site.
    #include_patterns:
    #  - '/TDClient/000/ExampleOrg/'         # this portal's knowledge base
    #  - 'example\.org/research-services/'   # one folder of a second site
    #  - 'github\.com/example-org/[A-Za-z0-9_.-]+(?:/|$)'  # one code host account

    # Pages the crawl must not fetch at all. Checked after include_patterns,
    # so an entry here always wins. The default is the files that are not
    # readable text plus what each enabled site handler adds: search forms,
    # logins, print views, tag pages, and code-host housekeeping pages.
    # Write an empty list ([]) to switch it off.
    #crawl_exclude_patterns:
    #  - '/Search[/?$]'
    #  - '/Login[/?$]'

    # Pages the crawl may visit and follow links from, but whose own content
    # stays out of the index. Use this for menu and category pages.
    #index_exclude_patterns:
    #  - '/Category/'
    #  - '/tree/'

    # Which site handlers take part in this crawl. Leave it out to use every
    # installed handler (tdx and github ship enabled). Write an empty list
    # ([]) to read every page with the generic handler only. The generic
    # handler is always on, and a handler that is off also stops adding its
    # exclude patterns.
    #site_handlers: [tdx, github]

  # A folder of Markdown, text, and HTML files on this machine. Content from
  # a local source stays out of every output unless that output sets
  # include_local: true (see the outputs list).
  #- type: local
  #  label: Internal Notes
  #  path: ./internal-docs
  #  include_globs: ["**/*.md", "**/*.txt", "**/*.html"]

  # A GitHub account's repositories, read through the API rather than
  # scraped page by page. Give exactly one of org, user, or url. Uses
  # GITHUB_TOKEN from the environment when it is set, which raises the
  # request limit; the same content is read without one.
  #
  # You often do not need this type at all: a web source whose seed_url is
  # a GitHub address reads the API by itself.
  #- type: github_api
  #  label: Example Repositories
  #  org: example-org
  #  #user: example-person          # instead of org, for a person's own repositories
  #  #url: https://github.com/example-org/example-tools   # or one repository
  #  include_repos: []              # empty means every repository that matches
  #  exclude_repos: []              # an exclusion always wins
  #  include_forks: false           # forks fill the index with near-identical copies
  #  include_archived: true         # archived documentation is still documentation
  #  include_code: true             # read the structure of the code, not only the docs
  #  ctags_fallback: true           # let Universal Ctags read languages no grammar covers
  #  max_file_bytes: 2000000        # larger files are skipped, and each one is named
  #
  # Code analysis needs the optional parser set: pip install "extractium[code]".
  # Without it every source file is still recorded by name, with its language,
  # its length, and a link. A record holds signatures, documentation, imports,
  # and calls -- never a source body. It also multiplies how many records a
  # repository produces, so set include_code: false where the code is not what
  # people are searching for.

  # Scholarly deposits held in a DSpace repository, such as a university
  # library's. Read through the repository's own interface, which already
  # holds the text of every deposited file, so no PDF reader is involved.
  #
  # The two addresses are different hosts and neither implies the other:
  # site_url is where a reader opens a deposit, and api_url is the interface
  # behind it, named in the reader site's own dspaceServer setting.
  #
  # Collections are listed, never discovered: a repository holds everybody's
  # deposits. Write each one as the handle link the repository publishes, or
  # as the identifier in the address a browser shows after following it.
  #- type: dspace
  #  label: Example Repository
  #  api_url: https://repository.example.edu/server/api
  #  site_url: https://repository.example.edu
  #  collections:
  #    - https://hdl.handle.net/9999.1/1001      # a handle link
  #    - 11111111-1111-4111-8111-111111111111    # or a collection identifier
  #  include_full_text: true         # false indexes each deposit's description alone
  #  max_file_bytes: 2000000         # larger files are skipped, and each one is named

  # Captions from a YouTube channel, playlists, or single videos. Listing a
  # channel or playlist needs YOUTUBE_API_KEY in the environment.
  #- type: youtube
  #  label: Example Video Library
  #  channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
  #  playlist_ids: []
  #  video_ids: []
  #  languages: [en]


