# ---------------------------------------------------------------------------
# Optional global settings -- the values shown are the defaults.
# Uncomment a line to change it.
# ---------------------------------------------------------------------------

# Display name of the compendium, the collection this build writes.
# Defaults to the title of the first page crawled.
#name: "Example Org Compendium"

# The short name the output files are named after: <slug>.json for the
# container and <slug>.sqlite for the database. Lowercase letters, digits,
# and hyphens, because it ends up in the published address.
#slug: compendium

# Folder every output is written under. A relative path is resolved from
# the folder you run the build in.
#out_dir: dist

# Folder for fetched pages between builds, so a rerun only downloads what
# changed.
#cache_dir: .kb_cache

# The most a source may read: web pages for a crawl, videos, deposits, or
# files for the other kinds. This is a safety net: if an include pattern
# is broader than you meant, the crawl still stops here, and a small value
# makes a quick trial of every source. A github_api source has its own two
# ceilings, max_repositories and max_files_per_repository, and meets this
# one only when it falls back to crawling documentation pages.
#max_pages: 10000

# The least time, in seconds, between two requests to the same site, so the
# crawl stays polite to the site it is reading. It holds across every source
# and every worker in the build. The default is 0.5; 0.8 is a kinder
# setting for a shared server. Use 0 for no wait.
#delay_seconds: 0.8

# How many sources run at the same time, and how many page fetches one web
# crawl keeps in flight. Both change how long a build takes and nothing
# else: a site is never asked faster than delay_seconds allows, and pages
# are indexed in the same order either way. While several sources run,
# each progress line starts with the label of its source. Set both to 1 to
# run everything one after another with a plain log.
#parallel_sources: 4
#parallel_pages: 4

# Extra GitHub accounts this build may follow links into. A GitHub account
# is read only when you named it: as a source, or here. Without this, one
# link in one README could pull thousands of other people's repositories
# into your index. Write exact account names, never patterns. Allowing an
# account lets links into it be followed; it does not list everything that
# account has published.
#github_owners:
#  - some-collaborator

# How the crawler introduces itself to each site. The default names the
# tool and its repository.
#user_agent: "Extractium/0.2 (+https://github.com/DepressionCenter/extractium)"

# How the crawler opens its connections. auto, the default, makes an
# ordinary request and, only when a site answers a bot-protection
# challenge, asks once more over a browser-shaped connection, keeping that
# choice for the host; the crawler still names itself. browser starts that
# way; plain never does. See docs/bot-protection-transport.md.
#transport: auto

# What a build does with a page it did not see this time. full, the
# default, publishes exactly what was read. incremental also keeps the
# pages of the last build that this one did not reach, unless the server
# answered 404 or 410 for them, so a site that was down for an hour does
# not empty the index; a page taken down on purpose still leaves it. Only
# pages from web sources are kept this way.
#rebuild: full

# Whether to honor each site's robots.txt. A site whose robots.txt cannot
# be read is skipped entirely. Switch it off only for sites you own: as
# well as ignoring robots rules, it lets a page that answers 403 to the
# crawler be requested once more as a browser, which is the only way past
# a filter that turns away anything that is not one.
#respect_robots_txt: true

# Which content the PHI (protected health information) check scans:
# local (local sources only), all, or off. Every build writes
# phi-lint-report.txt and phi-lint-report.json where you ran it, never
# into out_dir. Quote the value to switch the check off: YAML reads a
# bare off as false.
#phi_lint: local

# Whether every section is named with keywords and every page with tags,
# from the text alone and the vectors the build computes anyway. On by
# default. Needs the keywords extra; without it the build says so once
# and goes on with the fields empty.
#keywords: true


# ---------------------------------------------------------------------------
# Writing patterns safely
#
#  - Wrap every pattern in single quotes. YAML then keeps the text exactly
#    as you typed it, so a backslash stays a single backslash.
#  - A dot matches any character until you escape it: 'example\.edu'.
#  - Keep patterns simple. A very complicated pattern can make matching slow
#    on long URLs.
#  - Try a change with a small max_pages first, then raise it.
# ---------------------------------------------------------------------------
