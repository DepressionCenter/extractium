[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extractium"
version = "0.1.0"
description = "Lean knowledge-base compiler: crawls organizational sources and builds a portable, static, multi-format knowledge index (compendium) any LLM can consume."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gabriel Mongefranco" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime dependencies are declared here, not installed at import time via a
# pip-install shim (as the reference script's _ensure() helper did) -- an
# unpinned "pip install X" at import time is a supply-chain risk for a tool
# distributed to other organizations. See
# tests/reference/build_kb_index_reference.py for the frozen original this
# replaces. Every version bound below was confirmed to exist on PyPI at the
# time this file was written (2026-08-17).
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "sentence-transformers>=3.0.0,<6.0.0",
    # Not capped tightly to a specific minor: pip already resolves the
    # highest numpy release compatible with BOTH this range and the
    # running interpreter (numpy publishes accurate requires-python
    # metadata per release), so a Python 3.10 install lands on numpy 2.2.x
    # and a newer interpreter lands on a newer numpy automatically.
    "numpy>=1.26.0,<3.0.0",
    "Markdown>=3.6,<4.0.0",
    # Reads config.yaml (extractium.config.load_config, via yaml.safe_load).
    "PyYAML>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10.0.0", "pytest-cov>=5.0.0,<8.0.0"]
# Future output formats (see docs/extractium-spec.md section 4); no packages
# needed until those adapters are built.
parquet = []
duckdb = []

[project.scripts]
extractium = "extractium.cli:main"

# Plugin entry-point groups. A built-in source, site handler, or adapter
# is declared here, under the same group an external package would use,
# so extractium.core.registry resolves both through one path. An
# operator's plugins/ folder and other installed packages shadow entries
# of the same name (docs/extractium-spec.md section 2.2).
[project.entry-points."extractium.sources"]
web = "extractium.sources.web:WebSource"

[project.entry-points."extractium.site_handlers"]
generic = "extractium.sources.generic:GenericHandler"
tdx = "extractium.sources.tdx:TdxHandler"
github = "extractium.sources.github:GitHubHandler"

[project.entry-points."extractium.adapters"]

[tool.setuptools.packages.find]
include = ["extractium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
