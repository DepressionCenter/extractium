name: Release portable zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build the zip for, such as v0.5"
        required: true

# Least privilege by default. Only the job that attaches the zip writes,
# and only to the release.
permissions:
  contents: read

concurrency:
  group: release-portable-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build and attach the Windows zip
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Check out the release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      # The same installer a person runs, in portable mode, so the zip
      # holds exactly what the installer builds: uv at its pinned version
      # and hash, the managed Python, the lock with every hash checked,
      # and the tool as a plain copy. Beside the checkout it sees
      # pyproject.toml and installs from it.
      - name: Build the Extractium folder with the installer
        shell: cmd
        run: install.bat --portable --version %TAG%

      # The three models go into the folder's own cache, so a person
      # who unzips it downloads nothing before the first build.
      - name: Warm the model cache
        shell: pwsh
        run: |
          $python = Get-ChildItem -Path Extractium\python -Recurse -Filter python.exe | Select-Object -First 1
          $env:HF_HOME = "$PWD\Extractium\cache"
          & $python.FullName -I tools\warm_model_cache.py

      - name: Pack the zip and its hash
        id: pack
        shell: pwsh
        run: |
          $python = Get-ChildItem -Path Extractium\python -Recurse -Filter python.exe | Select-Object -First 1
          & $python.FullName -I tools\pack_portable.py --where . --out release --stem "extractium-$env:TAG-windows-portable" | Tee-Object -FilePath release\pack.txt
          "lines<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content release\pack.txt | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The runner's own token attaches the files; no third-party action
      # is given it. The four scripts go up beside the zip, so a lone
      # run.bat can fetch the installer from the newest release.
      - name: Attach the zip and the scripts to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem release\*.zip, release\*.sha256 | ForEach-Object { $_.FullName }) + @("install.bat", "install.sh", "run.bat", "run.sh")
          gh release upload $env:TAG $files --clobber

      - name: Add the hash to the release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_LINES: ${{ steps.pack.outputs.lines }}
        run: |
          $notes = gh release view $env:TAG --json body --jq .body
          if ($notes -notmatch "## Portable zip") {
            $indented = ($env:PACK_LINES -split "`n" | ForEach-Object { "    $_" }) -join "`n"
            $section = "`n`n## Portable zip`n`nSHA-256 of each file, as pack_portable.py printed it (name, hash, size):`n`n" + $indented
            Set-Content -Path release\notes.md -Value ($notes + $section) -NoNewline
            gh release edit $env:TAG --notes-file release\notes.md
          }
