# Last Modified: 2026-09-30
# Summary: Builds the portable Windows zip for a release and attaches it.
# Runs when a release is published, or by hand with a tag. On a Windows
# runner it runs the same installer a person runs, with --portable, so
# the zip holds the Extractium folder the installer builds: uv, a Python,
# the pinned packages, the tool, and the model cache warmed with the three
# models. It packs the folder with run.bat and install.bat, uploads the
# zip and its SHA-256 to the release, and adds the hash to the release
# notes. The tool's Python and every package come from the hash-pinned
# lock file; nothing else is downloaded.
# Notes: See README file for documentation and full license information.
