# Summary: Weekly scheduled build of a knowledge index, also runnable from
# the Actions tab with the "Run workflow" button. Installs the pinned
# dependencies, reuses the crawl cache between runs, and publishes the
# output folder to GitHub Pages through the official Pages actions. Copy
# this file into your own data repository; examples/data-repo/ holds the
# version to start from.
