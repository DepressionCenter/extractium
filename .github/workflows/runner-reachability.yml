name: Runner reachability check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      USER_AGENT: "Extractium/0.1.0 (+https://github.com/DepressionCenter/extractium)"
    steps:
      - name: Request each URL and log its status code
        shell: bash
        run: |
          set -u
          urls=(
            "https://teamdynamix.umich.edu/TDClient/210/DepressionCenter/Home/"
            "https://github.com/DepressionCenter"
            "https://raw.githubusercontent.com/DepressionCenter/FieldStationAI/main/README.md"
          )
          for url in "${urls[@]}"; do
            # -o /dev/null discards the body; -w prints only the facts we
            # need. A network failure prints 000 instead of stopping the loop.
            result=$(curl --silent --show-error --location --max-time 30 \
              --user-agent "$USER_AGENT" \
              --output /dev/null \
              --write-out "status=%{http_code} final_url=%{url_effective} bytes=%{size_download} type=%{content_type}" \
              "$url" 2>&1 || true)
            echo "$url -> $result"
          done
