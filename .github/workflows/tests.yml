name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.10", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Extractium with every extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,code,youtube]"

      - name: Run the Python test suite
        run: python -m pytest -q

  node:
    name: Node suites
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only the two examples with a lock file install anything; the
      # client and the shared core have no dependencies.
      - name: Install the examples' locked packages
        run: |
          npm ci --prefix examples/mcp/local-node
          npm ci --prefix examples/mcp/cloudflare

      - name: Run the Node test suites
        run: |
          node --test clients/js
          node --test examples/mcp/local-node
          node --test examples/mcp/shared
          node --test examples/mcp/valtown
          node --test examples/mcp/cloudflare
