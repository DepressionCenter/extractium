# Summary: Runs the Python and Node test suites on every pull request and
# on every push to main, on the oldest and newest supported Python
# versions and on Linux and Windows, since the code analysis and the
# archive reader are tested for both. Installs every optional extra so the
# parser and caption tests run rather than skip. Nothing here publishes,
# writes to the repository, or needs a secret.
